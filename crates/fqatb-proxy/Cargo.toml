[package]
name = "fqatb-proxy"
version = "0.1.0"
description = "Proxy that enforces fine-grained access tokens for Bitbucket"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Db
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }

# Web
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.7", features = ["trace"] }

# Crypto
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = "0.6"
getrandom = "0.4"
hkdf = "0.13"
secret = { git = "https://github.com/Devolutions/sspi-rs", rev = "2f447436fe6ff696aab9284bd18ab5f6410de5c1", version = "0.1", features = ["serde"] }
sha2 = "0.11"

# Utils
anyhow = "1.0"
base64 = "0.23"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.29", features = ["serde", "v4"] }

# Runtime
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
# Web
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
