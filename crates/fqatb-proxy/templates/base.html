<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- Validation errors come back as 422 with a fragment to show, so htmx swaps them in like successful responses. -->
    <meta
      name="htmx-config"
      content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
      integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU"
      crossorigin="anonymous"
    >
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
      integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        /* Pico grows the root font size up to 131% on wide screens, which inflates every rem-based size. */
        --pico-font-size: 100%;

        /* Compact form controls: Pico's defaults are sized for touch-first landing pages. */
        --fgatb-control-font-size: 0.875rem;
        --pico-form-element-spacing-vertical: 0.375rem;
        --pico-form-element-spacing-horizontal: 0.75rem;
      }

      input,
      select,
      textarea,
      button,
      [type=submit],
      [type=reset],
      [type=button],
      [role=button] {
        font-size: var(--fgatb-control-font-size);
      }

      /* Pico derives the input height from a 1rem font, so it is recomputed for the smaller font. */
      input:not([type=checkbox], [type=radio], [type=range]) {
        height: calc(
          var(--fgatb-control-font-size) * var(--pico-line-height)
          + var(--pico-form-element-spacing-vertical) * 2
          + var(--pico-border-width) * 2
        );
      }

      /* Pages behind the login share one readable column for the header and the content. */
      .container.app-page {
        max-width: 50rem;
      }

      /* Login and sign-up hold a single short form, so the card is kept narrow and centered. */
      .container.form-page {
        max-width: 26rem;
        padding-block: 4rem;
      }

      /* Navigation items never wrap; on phones they sit closer together to fit on one line. */
      header nav li {
        white-space: nowrap;
      }

      @media (max-width: 575px) {
        header nav li {
          padding-inline: 0.375rem;
        }
      }

      /* A form inside the navigation bar must not add Pico's bottom margin. */
      .nav-form,
      .nav-form button {
        margin: 0;
      }

      /* Sign-out submits a form, but looks like the header links next to it, in red because it ends the session. */
      .nav-form button.nav-link {
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
        color: var(--fgatb-danger);
        font: inherit;
        cursor: pointer;
      }

      .nav-form button.nav-link:is(:hover, :focus-visible) {
        color: var(--fgatb-danger-hover);
        text-decoration: underline;
      }

      /* Fields and their submit button on one row, aligned on the bottom edge. */
      .inline-form {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 0.75rem;
        align-items: end;
        margin-bottom: var(--pico-spacing);
      }

      .inline-form label,
      .inline-form input,
      .inline-form button {
        margin-bottom: 0;
      }

      @media (max-width: 575px) {
        .inline-form {
          grid-template-columns: 1fr;
        }
      }

      .form-error {
        display: block;
        margin-bottom: var(--pico-spacing);
        color: var(--pico-del-color);
      }

      /* Row action buttons hug the right edge and keep the table compact. */
      .row-actions {
        width: 1%;
        white-space: nowrap;
        text-align: right;
      }

      .row-actions button {
        margin: 0;
        padding: 0.125rem 0.5rem;
        font-size: 0.8125rem;
      }

      /* Destructive actions are red, outlined at rest and filled on hover. */
      :root {
        --fgatb-danger: #d93526;
        --fgatb-danger-hover: #b5291c;
      }

      button.outline.danger {
        --pico-color: var(--fgatb-danger);
        --pico-border-color: var(--fgatb-danger);
      }

      button.outline.danger:is(:hover, :active, :focus) {
        --pico-color: #fff;
        --pico-background-color: var(--fgatb-danger-hover);
        --pico-border-color: var(--fgatb-danger-hover);
      }

      button.outline.danger:focus-visible {
        --pico-box-shadow: 0 0 0 var(--pico-outline-width) rgba(217, 53, 38, 0.5);
      }

      /* Access token form: name and expiry on one row, then one card per rule. */
      .token-meta {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 0.75rem;
      }

      .rule-cards {
        counter-reset: rule;
      }

      .rule-card {
        counter-increment: rule;
        margin-bottom: var(--pico-spacing);
        padding: 0.75rem 1rem;
        border: var(--pico-border-width) solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
      }

      .rule-card legend {
        padding-inline: 0.25rem;
        font-weight: 600;
      }

      .rule-card legend::after {
        content: " " counter(rule);
      }

      .rule-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }

      .rule-grid label,
      .rule-grid input,
      .rule-grid select {
        margin-bottom: 0.5rem;
      }

      .action-groups {
        margin-block: 0.25rem 0.75rem;
      }

      .action-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem 1rem;
        margin-bottom: 0.25rem;
      }

      .action-group-label {
        width: 7rem;
        font-weight: 600;
      }

      .action-group label {
        margin: 0;
        font-size: var(--fgatb-control-font-size);
      }

      .action-group-note {
        color: var(--pico-muted-color);
        font-size: var(--fgatb-control-font-size);
      }

      .action-group .branch-pattern {
        flex: 1 1 12rem;
        max-width: 20rem;
        margin: 0;
      }

      .rule-grid.pull-request-branches {
        grid-template-columns: repeat(2, 1fr);
      }

      .rule-hint {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--pico-muted-color);
      }

      .rule-card .remove-rule {
        margin: 0;
        padding: 0.125rem 0.5rem;
        font-size: 0.8125rem;
      }

      .add-rule {
        margin-bottom: var(--pico-spacing);
      }

      .add-token {
        margin-bottom: calc(var(--pico-spacing) * 1.5);
      }

      .form-actions {
        display: flex;
        gap: 0.5rem;
      }

      .page-hint {
        color: var(--pico-muted-color);
        font-size: var(--fgatb-control-font-size);
      }

      .rules-hint {
        margin-bottom: 0.5rem;
        color: var(--pico-muted-color);
        font-size: var(--fgatb-control-font-size);
      }

      .rule-cards:has(.rule-card) + .rules-hint {
        display: none;
      }

      .issued-token {
        margin-bottom: calc(var(--pico-spacing) * 1.5);
        border-left: 4px solid var(--pico-ins-color);
      }

      .issued-token input {
        font-family: var(--pico-font-family-monospace);
      }

      mark.expired {
        padding: 0 0.25rem;
        font-size: 0.75rem;
      }

      @media (max-width: 575px) {
        .token-meta,
        .rule-grid {
          grid-template-columns: 1fr;
        }
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <title>{% block title %}{% endblock %} · FGAT Bitbucket</title>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
