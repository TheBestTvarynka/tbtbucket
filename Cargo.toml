[workspace]
resolver = "3"
members = ["tbtbucket"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# STYLE.md states checks positively (`!(idx < len)`), which this lint rewrites.
nonminimal_bool = "allow"
